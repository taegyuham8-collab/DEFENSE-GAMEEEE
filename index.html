<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>한화 vs LIG 디펜스 V4 - 피격 효과 강화</title>
    <style>
        body {
            background-color: #0b0c10;
            color: #c5c6c7;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            user-select: none;
        }

        h1 {
            margin: 0 0 10px 0;
            color: #ff6600;
            font-size: 24px;
        }

        .game-container {
            display: flex;
            gap: 20px;
            background: #1f2833;
            padding: 15px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7);
            position: relative;
        }

        canvas {
            border: 2px solid #ff6600;
            background-color: #0b0c10;
            border-radius: 4px;
            cursor: pointer;
        }

        .sidebar {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            width: 200px;
        }

        .info-box {
            background: #0b0c10;
            padding: 8px 10px;
            border-radius: 8px;
            margin-bottom: 6px;
            border: 1px solid #ff6600;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .info-title {
            font-size: 11px;
            color: #ff6600;
            text-transform: uppercase;
            font-weight: bold;
        }

        .info-value {
            font-size: 18px;
            font-weight: bold;
            color: #ffffff;
        }

        .tower-selector {
            display: flex;
            flex-direction: column;
            gap: 5px;
            margin-bottom: 8px;
        }

        .tower-btn {
            background: #0b0c10;
            border: 1px solid #45a29e;
            color: #fff;
            padding: 8px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 11px;
            text-align: left;
            transition: all 0.2s;
        }

        .tower-btn.active {
            border-color: #ff6600;
            background: #2b2d42;
            font-weight: bold;
            color: #ff6600;
        }

        .btn {
            background-color: #ff6600;
            color: #ffffff;
            border: none;
            padding: 10px;
            font-size: 13px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 5px;
            width: 100%;
        }

        .btn:hover {
            background-color: #e05500;
        }

        .btn-ult {
            background-color: #e63946;
            color: #fff;
        }
        .btn-ult:hover {
            background-color: #d62828;
        }

        .btn-reset {
            background-color: #2b2d42;
            color: white;
            border: 1px solid #8d99ae;
        }
        .btn-reset:hover {
            background-color: #8d99ae;
        }

        .selected-info {
            background: #0b0c10;
            padding: 8px;
            border-radius: 6px;
            font-size: 11px;
            border: 1px solid #45a29e;
            min-height: 48px;
            margin-bottom: 6px;
            line-height: 1.4;
        }

        .upgrade-btn {
            background-color: #00b4d8;
            color: #000;
            border: none;
            padding: 4px 8px;
            font-weight: bold;
            font-size: 11px;
            border-radius: 4px;
            cursor: pointer;
            margin-top: 4px;
        }
    </style>
</head>
<body>

    <h1>HANWHA vs LIG DEFENSE V4</h1>

    <div class="game-container">
        <canvas id="gameCanvas" width="600" height="400"></canvas>
        <div class="sidebar">
            <div>
                <div class="info-box">
                    <span class="info-title">Gold</span>
                    <span class="info-value" id="gold">200</span>
                </div>
                <div class="info-box">
                    <span class="info-title">Lives</span>
                    <span class="info-value" id="lives">10</span>
                </div>
                <div class="info-box">
                    <span class="info-title">Wave</span>
                    <span class="info-value" id="wave">1</span>
                </div>

                <div style="font-size:11px; margin: 6px 0 3px 0; color:#ff6600; font-weight:bold;">타워 선택:</div>
                <div class="tower-selector">
                    <button class="tower-btn active" id="tBtn1" onclick="selectTowerType(1)">
                        1. 한화 기본 포탑 (50G)
                    </button>
                    <button class="tower-btn" id="tBtn2" onclick="selectTowerType(2)">
                        2. 플라즈마 캐논 (80G)
                    </button>
                    <button class="tower-btn" id="tBtn3" onclick="selectTowerType(3)">
                        3. 레이저 발사기 (100G)
                    </button>
                </div>

                <div class="selected-info" id="selectedInfo">
                    타워 선택 후 빈 땅을 클릭하세요.
                </div>
            </div>

            <div>
                <button class="btn btn-ult" onclick="useAirstrike()">공중 지원 폭격 (150G)</button>
                <button class="btn" id="waveBtn" onclick="startWave()">웨이브 시작</button>
                <button class="btn btn-reset" onclick="resetGame()">재시작</button>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        const goldEl = document.getElementById('gold');
        const livesEl = document.getElementById('lives');
        const waveEl = document.getElementById('wave');
        const waveBtn = document.getElementById('waveBtn');
        const infoEl = document.getElementById('selectedInfo');

        let gold = 200;
        let lives = 10;
        let wave = 1;
        let waveInProgress = false;
        let gameOver = false;
        let selectedType = 1;
        let selectedTower = null;

        const path = [
            {x: 0, y: 100},
            {x: 180, y: 100},
            {x: 180, y: 300},
            {x: 420, y: 300},
            {x: 420, y: 100},
            {x: 600, y: 100}
        ];

        let towers = [];
        let enemies = [];
        let bullets = [];
        let particles = [];

        const TOWER_SPECS = {
            1: { name: '한화 기본', cost: 50, color: '#ff6600', range: 100, rate: 22, dmg: 25 },
            2: { name: '플라즈마', cost: 80, color: '#9d4edd', range: 90, rate: 35, dmg: 40, splash: 50 },
            3: { name: '레이저', cost: 100, color: '#00f5d4', range: 130, rate: 8, dmg: 10 }
        };

        function selectTowerType(type) {
            selectedType = type;
            selectedTower = null;
            document.querySelectorAll('.tower-btn').forEach((btn, idx) => {
                if (idx + 1 === type) btn.classList.add('active');
                else btn.classList.remove('active');
            });
            updateUI();
        }

        // 피격 시 튀는 파티클(피/스파크) 생성 함수
        function createBloodSplatter(x, y, isHeavy = false) {
            const count = isHeavy ? 15 : 8;
            for (let i = 0; i < count; i++) {
                const angle = Math.random() * Math.PI * 2;
                const speed = Math.random() * 4 + 1;
                particles.push({
                    x: x,
                    y: y,
                    vx: Math.cos(angle) * speed,
                    vy: Math.sin(angle) * speed,
                    radius: Math.random() * 3 + 1.5,
                    color: Math.random() < 0.7 ? '#d90429' : '#ff4d6d', // 피 색상
                    life: Math.floor(Math.random() * 15 + 10)
                });
            }
        }

        class Tower {
            constructor(x, y, type) {
                this.x = x;
                this.y = y;
                this.type = type;
                this.level = 1;
                this.radius = 18;

                let spec = TOWER_SPECS[type];
                this.color = spec.color;
                this.range = spec.range;
                this.fireRate = spec.rate;
                this.damage = spec.dmg;
                this.splash = spec.splash || 0;
                this.cooldown = 0;
            }

            upgrade() {
                let cost = this.getUpgradeCost();
                if (gold >= cost && this.level < 3) {
                    gold -= cost;
                    this.level++;
                    this.damage = Math.floor(this.damage * 1.5);
                    this.range += 15;
                    updateUI();
                    return true;
                }
                return false;
            }

            getUpgradeCost() {
                return this.level * 60;
            }

            draw() {
                if (selectedTower === this) {
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.range, 0, Math.PI * 2);
                    ctx.fillStyle = 'rgba(255, 102, 0, 0.08)';
                    ctx.fill();
                    ctx.strokeStyle = '#ff6600';
                    ctx.stroke();
                }

                // 한화 오렌지 외곽 링
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fill();
                ctx.lineWidth = this.level + 1;
                ctx.strokeStyle = '#ffffff';
                ctx.stroke();

                // 포탑 디자인 캐릭터
                ctx.fillStyle = '#0b0c10';
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius - 5, 0, Math.PI * 2);
                ctx.fill();

                ctx.fillStyle = '#ffffff';
                ctx.font = 'bold 11px sans-serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText('H' + (this.level > 1 ? this.level : ''), this.x, this.y);
            }

            update() {
                if (this.cooldown > 0) this.cooldown--;

                if (this.cooldown === 0) {
                    let target = null;
                    let minDist = Infinity;

                    for (let enemy of enemies) {
                        let dist = Math.hypot(enemy.x - this.x, enemy.y - this.y);
                        if (dist <= this.range && dist < minDist) {
                            minDist = dist;
                            target = enemy;
                        }
                    }

                    if (target) {
                        bullets.push({
                            x: this.x,
                            y: this.y,
                            target: target,
                            speed: this.type === 3 ? 12 : 7,
                            damage: this.damage,
                            color: this.color,
                            splash: this.splash
                        });
                        this.cooldown = this.fireRate;
                    }
                }
            }
        }

        class Enemy {
            constructor(type, hpMult, speedMult) {
                this.x = path[0].x;
                this.y = path[0].y;
                this.pathIndex = 0;
                this.type = type;

                if (type === 2) { // Fast
                    this.radius = 12;
                    this.maxHp = 30 * hpMult;
                    this.speed = 2.0 * speedMult;
                    this.color = '#ffb703';
                    this.reward = 15;
                } else if (type === 3) { // Heavy
                    this.radius = 18;
                    this.maxHp = 150 * hpMult;
                    this.speed = 0.8 * speedMult;
                    this.color = '#7209b7';
                    this.reward = 35;
                } else { // Normal
                    this.radius = 14;
                    this.maxHp = 55 * hpMult;
                    this.speed = 1.3 * speedMult;
                    this.color = '#00b4d8';
                    this.reward = 20;
                }
                this.hp = this.maxHp;
            }

            draw() {
                // LIG 캐릭터 그래픽
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fill();
                ctx.lineWidth = 2;
                ctx.strokeStyle = '#ffffff';
                ctx.stroke();

                // LIG 메카 바이저/심볼
                ctx.fillStyle = '#03045e';
                ctx.fillRect(this.x - this.radius/2, this.y - 3, this.radius, 6);

                ctx.fillStyle = '#ffffff';
                ctx.font = 'bold 8px sans-serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText('LIG', this.x, this.y);

                // 체력바
                let barW = this.radius * 2;
                let barH = 3;
                ctx.fillStyle = '#111';
                ctx.fillRect(this.x - barW/2, this.y - this.radius - 6, barW, barH);
                ctx.fillStyle = '#06d6a0';
                ctx.fillRect(this.x - barW/2, this.y - this.radius - 6, barW * (this.hp / this.maxHp), barH);
            }

            update() {
                let target = path[this.pathIndex + 1];
                if (!target) return true;

                let dx = target.x - this.x;
                let dy = target.y - this.y;
                let dist = Math.hypot(dx, dy);

                if (dist < this.speed) {
                    this.x = target.x;
                    this.y = target.y;
                    this.pathIndex++;
                } else {
                    this.x += (dx / dist) * this.speed;
                    this.y += (dy / dist) * this.speed;
                }
                return false;
            }
        }

        function drawPath() {
            ctx.beginPath();
            ctx.moveTo(path[0].x, path[0].y);
            for (let i = 1; i < path.length; i++) {
                ctx.lineTo(path[i].x, path[i].y);
            }
            ctx.lineWidth = 36;
            ctx.strokeStyle = '#2b2d42';
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            ctx.stroke();

            ctx.lineWidth = 30;
            ctx.strokeStyle = '#0b0c10';
            ctx.stroke();
        }

        function isPointNearPath(x, y) {
            for (let i = 0; i < path.length - 1; i++) {
                let p1 = path[i];
                let p2 = path[i + 1];
                let dist = distToSegment({x, y}, p1, p2);
                if (dist < 28) return true;
            }
            return false;
        }

        function distToSegment(p, v, w) {
            let l2 = Math.hypot(v.x - w.x, v.y - w.y) ** 2;
            if (l2 === 0) return Math.hypot(p.x - v.x, p.y - v.y);
            let t = ((p.x - v.x) * (w.x - v.x) + (p.y - v.y) * (w.y - v.y)) / l2;
            t = Math.max(0, Math.min(1, t));
            return Math.hypot(p.x - (v.x + t * (w.x - v.x)), p.y - (v.y + t * (w.y - v.y)));
        }

        canvas.addEventListener('click', (e) => {
            if (gameOver) return;

            const rect = canvas.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;

            for (let t of towers) {
                if (Math.hypot(t.x - x, t.y - y) < 25) {
                    selectedTower = t;
                    updateUI();
                    return;
                }
            }

            selectedTower = null;

            if (isPointNearPath(x, y)) return;

            let cost = TOWER_SPECS[selectedType].cost;
            if (gold >= cost) {
                gold -= cost;
                towers.push(new Tower(x, y, selectedType));
                updateUI();
            } else {
                infoEl.innerHTML = '<span style="color:#e63946;">골드가 부족합니다!</span>';
            }
        });

        function triggerUpgrade() {
            if (selectedTower) {
                if (selectedTower.level < 3) {
                    if (!selectedTower.upgrade()) {
                        alert('골드가 부족합니다!');
                    }
                }
            }
        }

        function useAirstrike() {
            if (gold >= 150 && waveInProgress && enemies.length > 0) {
                gold -= 150;
                enemies.forEach(e => {
                    e.hp -= 120;
                    createBloodSplatter(e.x, e.y, true);
                });
                updateUI();
            } else if (gold < 150) {
                alert('골드가 부족합니다 (150G 필요)');
            }
        }

        function startWave() {
            if (waveInProgress || gameOver) return;

            waveInProgress = true;
            waveBtn.disabled = true;
            waveBtn.style.opacity = '0.5';

            let totalCount = 6 + wave * 4;
            let spawned = 0;

            let spawnInterval = setInterval(() => {
                if (spawned < totalCount) {
                    let rand = Math.random();
                    let eType = 1;
                    if (rand < 0.25) eType = 2;
                    else if (rand > 0.75 && wave >= 2) eType = 3;

                    enemies.push(new Enemy(eType, 1 + wave*0.2, 1 + wave*0.05));
                    spawned++;
                } else {
                    clearInterval(spawnInterval);
                }
            }, 800);
        }

        function updateUI() {
            goldEl.innerText = gold;
            livesEl.innerText = lives;
            waveEl.innerText = wave;

            if (selectedTower) {
                let cost = selectedTower.getUpgradeCost();
                infoEl.innerHTML = `선택: <b>Lv.${selectedTower.level} ${TOWER_SPECS[selectedTower.type].name}</b><br>` +
                    (selectedTower.level < 3 ? `<button class="upgrade-btn" onclick="triggerUpgrade()">Lv.${selectedTower.level+1} 업그레이드 (${cost}G)</button>` : `<span style="color:#00f5d4;">최대 레벨 달성</span>`);
            } else {
                infoEl.innerHTML = `건설 선택: <b>${TOWER_SPECS[selectedType].name} 타워</b><br>설치 비용: ${TOWER_SPECS[selectedType].cost}G`;
            }
        }

        function gameLoop() {
            if (gameOver) return;

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            drawPath();

            towers.forEach(t => {
                t.update();
                t.draw();
            });

            for (let i = enemies.length - 1; i >= 0; i--) {
                let e = enemies[i];
                let reachedEnd = e.update();

                if (reachedEnd) {
                    lives--;
                    enemies.splice(i, 1);
                    updateUI();

                    if (lives <= 0) {
                        gameOver = true;
                        ctx.fillStyle = 'rgba(0,0,0,0.85)';
                        ctx.fillRect(0, 0, canvas.width, canvas.height);
                        ctx.fillStyle = '#ff2e63';
                        ctx.font = 'bold 32px sans-serif';
                        ctx.textAlign = 'center';
                        ctx.fillText('GAME OVER', canvas.width/2, canvas.height/2);
                        return;
                    }
                } else if (e.hp <= 0) {
                    createBloodSplatter(e.x, e.y, true);
                    gold += e.reward;
                    enemies.splice(i, 1);
                    updateUI();
                } else {
                    e.draw();
                }
            }

            for (let i = bullets.length - 1; i >= 0; i--) {
                let b = bullets[i];
                let dx = b.target.x - b.x;
                let dy = b.target.y - b.y;
                let dist = Math.hypot(dx, dy);

                if (dist < b.speed || !enemies.includes(b.target)) {
                    if (enemies.includes(b.target)) {
                        b.target.hp -= b.damage;
                        // 타격 시 피 효과 발생
                        createBloodSplatter(b.target.x, b.target.y);

                        if (b.splash > 0) {
                            enemies.forEach(e => {
                                if (e !== b.target && Math.hypot(e.x - b.x, e.y - b.y) <= b.splash) {
                                    e.hp -= Math.floor(b.damage * 0.6);
                                    createBloodSplatter(e.x, e.y);
                                }
                            });
                        }
                    }
                    bullets.splice(i, 1);
                } else {
                    b.x += (dx / dist) * b.speed;
                    b.y += (dy / dist) * b.speed;

                    ctx.fillStyle = b.color;
                    ctx.beginPath();
                    ctx.arc(b.x, b.y, b.splash > 0 ? 5 : 3, 0, Math.PI * 2);
                    ctx.fill();
                }
            }

            // 피격 및 폭발 파티클 업데이트
            for (let i = particles.length - 1; i >= 0; i--) {
                let p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.life--;

                ctx.fillStyle = p.color;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                ctx.fill();

                if (p.life <= 0) particles.splice(i, 1);
            }

            if (waveInProgress && enemies.length === 0) {
                waveInProgress = false;
                wave++;
                gold += 60;
                updateUI();
                waveBtn.disabled = false;
                waveBtn.style.opacity = '1';
            }

            requestAnimationFrame(gameLoop);
        }

        function resetGame() {
            gold = 200;
            lives = 10;
            wave = 1;
            waveInProgress = false;
            gameOver = false;
            towers = [];
            enemies = [];
            bullets = [];
            particles = [];
            selectedTower = null;
            waveBtn.disabled = false;
            waveBtn.style.opacity = '1';
            updateUI();
            requestAnimationFrame(gameLoop);
        }

        updateUI();
        requestAnimationFrame(gameLoop);
    </script>
</body>
</html>
